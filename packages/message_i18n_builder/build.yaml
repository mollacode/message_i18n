builders:
  message_i18n_builder:
    import: "package:message_i18n_builder/builder.dart"
    builder_factories: ["messageI18nBuilder"]
    build_extensions: {".dart": [".message_i18n.g.dart"]}
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        include: ["lib/**.dart"]
        exclude: ["lib/**.g.dart", "lib/**.freezed.dart"]
